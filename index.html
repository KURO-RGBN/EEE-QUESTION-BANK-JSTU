<script>
// 1. Semester Data (Replaces your <option> tags)
const semesters = [
    { label: "All Semesters", value: "all" },
    { label: "1st Year 1st Sem", value: "1st Year 1st Semester" },
    { label: "1st Year 2nd Sem", value: "1st Year 2nd Semester" },
    { label: "2nd Year 1st Sem", value: "2nd Year 1st Semester" },
    { label: "2nd Year 2nd Sem", value: "2nd Year 2nd Semester" },
    { label: "3rd Year 1st Sem", value: "3rd Year 1st Semester" },
    { label: "3rd Year 2nd Sem", value: "3rd Year 2nd Semester" },
    { label: "4th Year 1st Sem", value: "4th Year 1st Semester" },
    { label: "4th Year 2nd Sem", value: "4th Year 2nd Semester" }
];

let selectedSemValue = "all";

// 2. Open/Close Modal with Animation
function toggleSemModal(show) {
    const modal = document.getElementById('semModal');
    
    if (show) {
        renderSemOptions();
        modal.classList.remove('hidden');
        modal.offsetHeight; // Forces immediate execution
        modal.classList.add('active-sheet');
    } else {
        modal.classList.remove('active-sheet');
        
        // Match the 0.2s (200ms) CSS transition
        setTimeout(() => {
            if (!modal.classList.contains('active-sheet')) {
                modal.classList.add('hidden');
            }
        }, 200); 
    }
}
// 3. Render the list of buttons (The UI for your options)
function renderSemOptions() {
    const container = document.getElementById('semOptionsList');
    container.innerHTML = semesters.map(s => `
        <button onclick="applyPremiumFilter('${s.value}', '${s.label}')" 
            class="w-full flex items-center justify-between p-4 mb-2 rounded-2xl transition-all ${selectedSemValue === s.value ? 'bg-red-600 text-white shadow-lg' : 'hover:bg-slate-50 text-slate-600 font-bold'}">
            <span class="text-sm">${s.label}</span>
            ${selectedSemValue === s.value ? '<i class="fa-solid fa-circle-check"></i>' : ''}
        </button>
    `).join('');
}

// 4. Filter Logic (Integrated with your existing renderCourses function)
function applyPremiumFilter(val, label) {
    selectedSemValue = val;
    document.getElementById('currentSemesterText').innerText = label;
    toggleSemModal(false);
    
    const query = document.getElementById('mainSearch').value.toLowerCase();
    const filtered = courseData.filter(c => 
        (c.title.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)) &&
        (selectedSemValue === "all" || c.semester === selectedSemValue)
    );
    renderCourses(filtered);
}



	
    let courseData = [];
    const batches = ["20-21", "21-22", "22-23", "23-24", "24-25"];
    let currentPages = []; 
    let currentPageIndex = 0;
	async function init() {
    try {
        // Cache Buster added here to force automatic refresh on every open
        const res = await fetch('data.json?t=' + Date.now()); 
        courseData = await res.json();
        renderCourses(courseData);
        
        // Listeners for your search and semester dropdown
     document.getElementById('mainSearch').addEventListener('input', () => {
    applyPremiumFilter(selectedSemValue, document.getElementById('currentSemesterText').innerText);
});
       
    } 
		catch (err) { 
    console.error("Data load failed", err); 
    document.getElementById('courseContainer').innerHTML = 
        "<p style='color:red'>Failed to load data.json</p>";
}
    
}

function renderCourses(data) {
    const container = document.getElementById('courseContainer');
    // Using your full original logic to ensure no features are lost
    container.innerHTML = data.map((course) => {
        const hasNotes = course.notes && course.notes.length > 0;
        return `
            <div class="glass-card p-6 rounded-3xl shadow-sm border border-white mb-4">
                <div class="flex flex-col gap-3">
                    <div>
                        <span class="text-[10px] font-black text-red-600 bg-red-50 px-2 py-0.5 rounded uppercase border border-red-100">${course.code}</span>
                        <h3 class="text-lg font-bold text-slate-800 leading-tight mt-1">${course.title}</h3>
                    </div>
                    <div class="scroll-container">
                        <button onclick="${hasNotes ? `openNotes('${course.code}')` : 'openUpload()'}" 
                                class="session-btn p-3 rounded-2xl flex flex-col items-center justify-center ${hasNotes ? 'btn-notes' : ''}">
                            <span class="text-[10px] uppercase font-bold tracking-tighter">NOTES</span>
                            <span class="text-[8px] opacity-70">${hasNotes ? 'VIEW' : 'MISSING'}</span>
                        </button>
                        ${batches.map(batch => {
                            const link = course.links[batch];
                            const isMissing = !link || link === "missing" || (Array.isArray(link) && link.length === 0);
                            const clickAction = isMissing ? 'openUpload()' : `openPaperByCode('${course.code}', '${batch}')`;
                            return `
                                <button onclick="${clickAction}" 
                                        class="session-btn p-3 rounded-2xl flex flex-col items-center justify-center ${!isMissing ? 'btn-available' : ''}">
                                    <span class="text-[10px] uppercase font-bold tracking-tighter">${batch}</span>
                                    <span class="text-[8px] opacity-70">${isMissing ? 'MISSING' : 'OPEN'}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>
        `}).join('');
}


    
// --- PREMIUM DOWNLOAD & MODAL SYSTEM ---
function confirmDownload(url, fileName) {
    // 1. Check if an alert already exists to prevent duplicates
    if (document.getElementById('customAlert')) return;

    const alertHTML = `
        <div id="customAlert" class="premium-alert-overlay">
            <div class="premium-alert-card">
                <div class="alert-icon-circle">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                </div>
                <h3 style="color: #1e293b; font-weight: 800; font-size: 18px; margin-bottom: 8px;">Download Notes?</h3>
                <p style="color: #64748b; font-size: 12px; line-height: 1.5; word-break: break-word;">${fileName}</p>
                <div class="alert-btn-group">
                    <button class="alert-btn btn-cancel" onclick="closeAlert()">Cancel</button>
                    <button class="alert-btn btn-confirm" id="startDownload">Download</button>
                </div>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', alertHTML);
    const alertEl = document.getElementById('customAlert');
    setTimeout(() => alertEl.classList.add('active'), 10);

    document.getElementById('startDownload').onclick = () => {
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    closeAlert();
};
}




function closeAlert() {
    const alertEl = document.getElementById('customAlert');
    if (alertEl) {
        alertEl.classList.remove('active');
        setTimeout(() => alertEl.remove(), 300);
    }
}

// Smart APK Refresh Blocker variables
let touchStartLine = 0;
function handleTouchStart(e) { touchStartLine = e.touches[0].pageY; }
function handleTouchMove(e) {
    const list = document.getElementById('notesList');
    const touchCurrent = e.touches[0].pageY;
    if (list.scrollTop <= 0 && touchCurrent > touchStartLine) {
        if (e.cancelable) e.preventDefault(); 
    }
}

function openNotes(code) {
    // Find the course in your data.json
    const course = courseData.find(c => c.code === code);
    const list = document.getElementById('notesList');
    const modal = document.getElementById('notesModal');
    const main = document.getElementById('appBody'); // Ensure your main content has this ID
    
    document.getElementById('notesCourseTitle').innerText = `${course.code}: ${course.title}`;
    
    // Generate the notes grid
    // Note: We add .pdf automatically here to the filename
    list.innerHTML = course.notes.map(note => `
        <div class="file-card" onclick="confirmDownload('${note.url}', '${note.name}.pdf')">
            <i class="fa-solid fa-file-pdf text-3xl text-red-600 mb-2"></i>
            <span class="text-[11px] font-bold text-slate-700 line-clamp-2">${note.name}</span>
            <span class="text-[9px] text-slate-400 mt-1 uppercase font-black tracking-wider">Download</span>
        </div>
    `).join('');
    
    modal.classList.remove('hidden');

    // Block APK pull-to-refresh
    window.addEventListener('touchstart', handleTouchStart, { passive: false });
    window.addEventListener('touchmove', handleTouchMove, { passive: false });

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            modal.classList.add('active-sheet');
            // Move main content off-screen to prevent text "ghosting" through the modal
            
            document.body.classList.add('modal-open');
        });
    });
}

function closeNotes() {
    const modal = document.getElementById('notesModal');
    const main = document.getElementById('appBody');
    
    modal.classList.remove('active-sheet');
    
    document.body.classList.remove('modal-open');

    window.removeEventListener('touchstart', handleTouchStart);
    window.removeEventListener('touchmove', handleTouchMove);

    setTimeout(() => {
        if (!modal.classList.contains('active-sheet')) {
            modal.classList.add('hidden');
        }
    }, 500); 
}


    function openPaperByCode(code, batch) {
        const course = courseData.find(c => c.code === code);
        if (course) {
            const links = course.links[batch];
            viewPaper(links, `${course.title} - ${batch}`);
        }
    }

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const index = Array.from(entry.target.parentNode.children).indexOf(entry.target);
            document.getElementById('pageCounter').innerText = `PAGE ${index + 1} OF ${currentPages.length}`;
        }
    });
}, { threshold: 0.5 });


function viewPaper(links, title) {
    currentPages = Array.isArray(links) ? links : [links];
    document.getElementById('viewingTitle').innerText = title;

    const filmstrip = document.getElementById('paperFilmstrip');

    filmstrip.innerHTML = currentPages.map((url) => `
        <div class="viewer-page">
            <div class="zoom-wrapper">
                <img src="${url}" loading="lazy">
            </div>
        </div>
    `).join('');

    enableImageZoom();

    const modal = document.getElementById('viewerModal');
    modal.classList.remove('hidden');

    requestAnimationFrame(() => {
        modal.classList.add('viewer-active');
    });

    filmstrip.scrollTop = 1;  // tiny offset
filmstrip.scrollTop = 0;  // reset
}

	function enableImageZoom() {
    const wrappers = document.querySelectorAll('.zoom-wrapper');

    setTimeout(() => {
    wrappers.forEach(wrapper => {
        const img = wrapper.querySelector('img');

        let scale = 1;
        let lastScale = 1;

        let panX = 0;
        let panY = 0;

        let startX = 0;
        let startY = 0;

        let startDist = 0;
        let isPanning = false;
        let lastTap = 0;

        const MIN_SCALE = 1;
        const MAX_SCALE = 4;

        function update() {
            img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function clampPan() {
            const limitX = (img.clientWidth * (scale - 1)) / 2;
            const limitY = (img.clientHeight * (scale - 1)) / 2;

            panX = Math.max(-limitX, Math.min(limitX, panX));
            panY = Math.max(-limitY, Math.min(limitY, panY));
        }

        // DOUBLE TAP
        wrapper.addEventListener('touchend', (e) => {
            const now = Date.now();

            if (now - lastTap < 280) {
                if (scale > 1) {
                    scale = 1;
                    panX = 0;
                    panY = 0;

                    wrapper.style.touchAction = "pan-y"; // ✅ restore scroll
                } else {
                    scale = 2.2;

                    wrapper.style.touchAction = "none"; // ❌ block scroll while zoomed
                }
                update();
            }

            lastTap = now;
        });

        // TOUCH START
        wrapper.addEventListener('touchstart', (e) => { 
			if (scale === 1) return;
            if (e.touches.length === 2) {
                startDist = getDistance(e.touches);
                lastScale = scale;
                isPanning = false;

                wrapper.style.touchAction = "none"; // pinch = block scroll
            }

            if (e.touches.length === 1 && scale > 1) {
                isPanning = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            }
        }, { passive: false });

        // TOUCH MOVE
        wrapper.addEventListener('touchmove', (e) => {

            // PINCH
            if (e.touches.length === 2) {
                e.preventDefault();

                const newDist = getDistance(e.touches);
                scale = lastScale * (newDist / startDist);

                scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
                update();
            }

            // PAN ONLY IF ZOOMED
            if (e.touches.length === 1 && isPanning && scale > 1) {
                e.preventDefault();

                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;

                clampPan();
                update();
            }

        }, { passive: false });

        wrapper.addEventListener('touchend', () => {
            isPanning = false;

            if (scale <= 1) {
                wrapper.style.touchAction = "pan-y"; // restore scroll
            }
        });
    },120);
}

function getDistance(touches) {
    const dx = touches[0].pageX - touches[1].pageX;
    const dy = touches[0].pageY - touches[1].pageY;
    return Math.sqrt(dx * dx + dy * dy);
}
