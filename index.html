<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EEE Question Bank Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon.jpeg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            overscroll-behavior-y: contain; 
            -webkit-overflow-scrolling: touch;
            user-select: none;
            color: #e5e5e5;
        }
        .glass-card { background: rgba(15, 15,15, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(220,38,38,0.1); }
        
.session-btn:active {
        background-color: #dc2626 !important;
        color: white !important;
        box-shadow: 0 0 20px #dc2626;
        transform: scale(0.95);
    }
    
    /* For PC Hover */
    @media (hover: hover) {
        .session-btn:hover {
            border-color: #dc2626;
            color: #dc2626;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.2);
        }
    }

    ::-webkit-scrollbar { width: 0px; }
</style>


        
        /* Hide scrollbar but allow scrolling */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

    <nav class="bg-black text-white shadow-xl border-b border-red-900/30 sticky top-0 z-50 p-4 pt-8">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-brain text-red-600 text-2xl"></i>
            <h1 class="font-bold text-xl tracking-tight uppercase">EEE <span class="text-red-600">Vault</span></h1>
        </div>
        <button onclick="openUpload()" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-full text-sm font-semibold transition shadow-[0_0_15px_rgba(220,38,38,0.5)] active:scale-95">
            <i class="fa-solid fa-plus mr-1"></i> Add Paper
        </button>
    </div>
</nav>

    <main class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="glass-card p-6 rounded-3xl shadow-sm mb-8 border border-white">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-4 top-4 text-slate-400"></i>
                    <input type="text" id="mainSearch" placeholder="Search Title or Code..." 
                    class="w-full pl-12 pr-4 py-3 rounded-2xl border-none bg-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <select id="semesterFilter" class="bg-slate-100 py-3 px-4 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 appearance-none">
                    <option value="all">All Semesters</option>
                    <option value="1st Year 1st Semester">1st Year 1st Sem</option>
                    <option value="1st Year 2nd Semester">1st Year 2nd Sem</option>
                    <option value="2nd Year 1st Semester">2nd Year 1st Sem</option>
                    <option value="2nd Year 2nd Semester">2nd Year 2nd Sem</option>
                    <option value="3rd Year 1st Semester">3rd Year 1st Sem</option>
                    <option value="3rd Year 2nd Semester">3rd Year 2nd Sem</option>
                    <option value="4th Year 1st Semester">4th Year 1st Sem</option>
                    <option value="4th Year 2nd Semester">4th Year 2nd Sem</option>
                </select>
            </div>
        </div>

        <div id="courseContainer" class="grid grid-cols-1 gap-6"></div>
    </main>

    <div id="viewerModal" class="fixed inset-0 bg-slate-900 z-[100] hidden flex flex-col animate-fade-in">
        <div class="p-4 bg-white flex justify-between items-center shadow-md">
            <h2 id="viewingTitle" class="font-bold truncate pr-4 text-slate-800"></h2>
            <button onclick="closeViewer()" class="text-red-500 font-bold px-3 py-1 bg-red-50 rounded-lg">CLOSE</button>
        </div>
        <iframe id="pdfIframe" class="w-full flex-grow border-none bg-white"></iframe>
    </div>

    <div id="uploadModal" class="fixed inset-0 bg-white z-[100] hidden overflow-y-auto">
        <div class="max-w-xl mx-auto p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-900">Contribute</h2>
                <button onclick="closeUpload()" class="text-3xl">&times;</button>
            </div>
            <iframe src="YOUR_GOOGLE_FORM_LINK" width="100%" height="700" frameborder="0">Loading…</iframe>
        </div>
    </div>

    <script>
        let courseData = [];
        const batches = ["20-21", "21-22", "22-23", "23-24", "24-25"];

        async function init() {
            try {
                const res = await fetch('data.json');
                courseData = await res.json();
                renderCourses(courseData);
                document.getElementById('mainSearch').addEventListener('input', filterContent);
                document.getElementById('semesterFilter').addEventListener('change', filterContent);
            } catch (err) { console.error("Data load failed"); }
        }

        function renderCourses(data) {
            const container = document.getElementById('courseContainer');
            if(data.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">No courses found matching your search.</div>`;
                return;
            }
            container.innerHTML = data.map(course => `
                <div class="glass-card p-6 rounded-3xl shadow-sm border border-white hover:shadow-md transition">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex-1">
                            <span class="text-[10px] font-black text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded uppercase mb-1 inline-block border border-indigo-100">${course.code}</span>
                            <h3 class="text-lg font-bold text-slate-800 leading-tight">${course.title}</h3>
                            <p class="text-xs text-slate-400 mt-1">${course.semester}</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${batches.map(batch => {
                                const link = course.links[batch];
                                const isMissing = !link || link === "missing";
                                return `
                                    <button onclick="${isMissing ? 'openUpload()' : `viewPaper('${link}', '${course.title} - ${batch}')`}" 
                                            class="flex-1 min-w-[70px] text-center p-2 rounded-2xl border transition active:scale-90 
                                            ${isMissing ? 'bg-white text-slate-300 border-slate-100 border-dashed' : 'bg-indigo-50 text-indigo-700 border-indigo-200 font-bold shadow-sm'}">
                                        <div class="text-[10px] opacity-70">${batch}</div>
                                        <div class="text-[9px] uppercase tracking-tighter">${isMissing ? 'Missing' : 'Open'}</div>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterContent() {
            const query = document.getElementById('mainSearch').value.toLowerCase();
            const sem = document.getElementById('semesterFilter').value;
            const filtered = courseData.filter(c => 
                (c.title.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)) &&
                (sem === "all" || c.semester === sem)
            );
            renderCourses(filtered);
        }

        function viewPaper(url, title) {
            document.getElementById('viewingTitle').innerText = title;
            document.getElementById('pdfIframe').src = url;
            document.getElementById('viewerModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeViewer() {
            document.getElementById('viewerModal').classList.add('hidden');
            document.getElementById('pdfIframe').src = "";
            document.body.style.overflow = 'auto';
        }

        function openUpload() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUpload() { document.getElementById('uploadModal').classList.add('hidden'); }

        init();
    </script>
</body>
</html>
