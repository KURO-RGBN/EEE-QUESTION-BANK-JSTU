    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: relative; z-index: 1; }

    .btn-notes {

        border: 1px solid rgba(255, 152, 0, 0.4) !important;  
        color: #ef6c00 !important;  
    }  

    /* File Card Styling */  
    .file-card {  
        background: #f8fafc;  
        border: 1px solid #e2e8f0;  
        border-radius: 16px;  
        padding: 16px;  
        text-align: center;  
        display: flex;  
        flex-direction: column;  
        align-items: center;  
        transition: 0.2s;  
    }  
    .file-card:active { transform: scale(0.95); background: #f1f5f9; }   
    body.modal-open { overflow: hidden; touch-action: none; }
	
    /* Container now stacks images vertically */
    .viewer-filmstrip {
        display: block;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        scroll-behavior: smooth;
    }

    .viewer-page {
        width: 100%;
        display: block;
        margin-bottom: 12px;
    }

    .viewer-page img {
        width: 100%;
        height: auto;
        display: block;
        user-select: none;
    }

    /* FIXED ZOOM SYSTEM */

        position: relative;
        overflow: hidden;
        touch-action: pan-y;
    }

    .zoom-wrapper img {
        width: 100%;
        transform-origin: center center;
        will-change: transform;
        transition: transform 0.08s linear;
    }

    .modal-content-pop {
        position: relative;
        z-index: 130;
        transform: scale(0.95);
        opacity: 0;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s linear;
        will-change: transform, opacity;
    }

    .modal-overlay.active-sheet .modal-content-pop { transform: scale(1); opacity: 1; }

    /* --- PREMIUM ANIMATION & SCROLL SYSTEM --- */
    .modal-overlay {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease, backdrop-filter 0.4s ease;
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
    }

    .modal-overlay.active-sheet {  
        opacity: 1;  
        pointer-events: auto;  
        backdrop-filter: blur(8px);  
        -webkit-backdrop-filter: blur(8px);  
    }  

    .modal-content-slide {   
        position:relative;  
        z-index:130;  
        transform: translateY(100%);  
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);  
        will-change: transform;  
        overscroll-behavior-y: contain;   
    }  

    .modal-overlay.active-sheet .modal-content-slide { transform: translateY(0%); }  

    /* --- PREMIUM DOWNLOAD ALERT STYLES --- */
    .premium-alert-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 20000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
    }

    .premium-alert-overlay.active { opacity: 1; pointer-events: auto; }

    .premium-alert-card {
        background: white;
        width: 85%;
        max-width: 320px;
        padding: 24px;
        border-radius: 28px;
        text-align: center;
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .premium-alert-overlay.active .premium-alert-card { transform: scale(1); }

    .alert-icon-circle {
        width: 60px;
        height: 60px;
        background: #fee2e2;
        color: #dc2626;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 24px;

    .alert-btn-group { display: flex; gap: 12px; margin-top: 24px; }
    .alert-btn { flex: 1; padding: 12px; border-radius: 14px; font-weight: 700; font-size: 14px; transition: all 0.2s; }

<script>
// 1. DATA & STATE
const semesters = [
    { label: "All Semesters", value: "all" },
    { label: "1st Year 1st Sem", value: "1st Year 1st Semester" },
    { label: "1st Year 2nd Sem", value: "1st Year 2nd Semester" },
    { label: "2nd Year 1st Sem", value: "2nd Year 1st Semester" },
    { label: "2nd Year 2nd Sem", value: "2nd Year 2nd Semester" },
    { label: "3rd Year 1st Sem", value: "3rd Year 1st Semester" },
    { label: "3rd Year 2nd Sem", value: "3rd Year 2nd Semester" },
    { label: "4th Year 1st Sem", value: "4th Year 1st Semester" },
    { label: "4th Year 2nd Sem", value: "4th Year 2nd Semester" }
];

let selectedSemValue = "all";
let courseData = [];
const batches = ["20-21", "21-22", "22-23", "23-24", "24-25"];
let currentPages = [];
let touchStartLine = 0;
let activeDownloadData = null;

// 2. INITIALIZATION
async function init() {
    try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();
        courseData = data.Course ? data.Course : data;
        renderCourses(courseData);
    } catch (err) {
        console.error("Data load failed", err);
    }
}

// 3. UI RENDERING & FILTERING
function renderCourses(data) {
    const container = document.getElementById('courseContainer');
    container.innerHTML = data.map((course) => {
        const hasNotes = course.notes && course.notes.length > 0;
        return `
            <div class="glass-card p-6 rounded-3xl shadow-sm border border-white mb-4">
                <div class="flex flex-col gap-3">
                    <div>
                        <span class="text-[10px] font-black text-red-600 bg-red-50 px-2 py-0.5 rounded uppercase border border-red-100">${course.code}</span>
                        <h3 class="text-lg font-bold text-slate-800 leading-tight mt-1">${course.title}</h3>
                    </div>
                    <div class="scroll-container">
                        <button onclick="${hasNotes ? `openNotes('${course.code}')` : 'openUpload()'}" 
                                class="session-btn p-3 rounded-2xl flex flex-col items-center justify-center ${hasNotes ? 'btn-notes' : ''}">
                            <span class="text-[10px] uppercase font-bold tracking-tighter">NOTES</span>
                            <span class="text-[8px] opacity-70">${hasNotes ? 'VIEW' : 'MISSING'}</span>
                        </button>
                        ${batches.map(batch => {
                            const link = course.links ? course.links[batch] : null;
                            const isMissing = !link || (Array.isArray(link) && link.length === 0) || link === "missing";
                            return `
                                <button onclick="${isMissing ? 'openUpload()' : `openPaperByCode('${course.code}', '${batch}')`}" 
                                        class="session-btn p-3 rounded-2xl flex flex-col items-center justify-center ${!isMissing ? 'btn-available' : ''}">
                                    <span class="text-[10px] uppercase font-bold tracking-tighter">${batch}</span>
                                    <span class="text-[8px] opacity-70">${isMissing ? 'MISSING' : 'OPEN'}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            </div>`;
    }).join('');
}

// 4. BUNDLED PREMIUM PDF GENERATION SYSTEM
function confirmPdfDownload() {
    const alertHTML = `
        <div id="customAlert" class="premium-alert-overlay">
            <div class="premium-alert-card">
                <div class="alert-icon-circle"><i class="fa-solid fa-file-pdf"></i></div>
                <h3 style="color: #1a1a1b; font-weight: 800; margin-bottom: 8px;">Compile PDF?</h3>
                <p style="color: #64748b; font-size: 12px; margin-bottom: 20px;">Download all question pages compiled into a single A4 PDF file.</p>
                <div class="alert-btn-group">
                    <button class="alert-btn btn-cancel" onclick="closeAlert()">Cancel</button>
                    <button class="alert-btn btn-confirm" onclick="executePdfDownload()">Start</button>
                </div>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', alertHTML);
    setTimeout(() => document.getElementById('customAlert').classList.add('active'), 10);
}
async function executePdfDownload() {
    closeAlert();
    const pdfBtn = document.getElementById('pdfBtn');
    const headerLoader = document.getElementById('headerLoader');
    
    pdfBtn.classList.add('hidden');
    headerLoader.classList.remove('hidden');

    try {
        const currentTitle = document.getElementById('viewingTitle').innerText.trim();
        let formattedName = currentTitle
            .replace(/\s+-\s+/g, '_')   
            .replace(/\s+/g, '_')      
            .replace(/[^a-zA-Z0-9-_]/g, ''); 
            
        const finalFileName = `${formattedName || 'session_papers'}.pdf`;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4'); 
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();

        for (let i = 0; i < currentPages.length; i++) {
            if (i > 0) pdf.addPage();

            const cleanUrl = currentPages[i].replace(/^https?:\/\//, '');
            const proxyUrl = `https://images.weserv.nl/?url=${encodeURIComponent(cleanUrl)}`;

            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error(`Failed to fetch page ${i + 1}`);
            const blob = await response.blob();
            
            const imgData = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });

            const img = new Image();
            await new Promise((resolve) => {
                img.onload = resolve;
                img.src = imgData;
            });

            let renderWidth = pdfWidth;
            let renderHeight = (img.height * pdfWidth) / img.width;

            if (renderHeight > pdfHeight) {
                renderHeight = pdfHeight;
                renderWidth = (img.width * pdfHeight) / img.height;
            }

            const xOffset = (pdfWidth - renderWidth) / 2;
            const yOffset = (pdfHeight - renderHeight) / 2;

            pdf.addImage(imgData, 'JPEG', xOffset, yOffset, renderWidth, renderHeight);
        }
        
        // --- NATIVE SYSTEM DOWNLOAD FORCING LAYER ---
        const pdfBlob = pdf.output('blob');

        // Create a temporary upload payload to obtain a public downloadable stream link
        const formData = new FormData();
        formData.append('file', pdfBlob, finalFileName);

        // Upload securely to bashupload ephemeral storage system
        const uploadResponse = await fetch('https://bashupload.com/', {
            method: 'POST',
            body: formData
        });

        if (!uploadResponse.ok) throw new Error("Upload handler failed");
        
        const responseText = await uploadResponse.text();
        // Extract the target unique URL link from response text
        const downloadUrlMatch = responseText.match(/https:\/\/bashupload\.com\/[^\s]+/);
        
        if (downloadUrlMatch && downloadUrlMatch[0]) {
            const serverDownloadUrl = downloadUrlMatch[0].trim();
            
            // Force open this directly in the system's external native browser (Chrome/Samsung Internet)
            // This pulls the action out of the broken WebView sandbox entirely
            window.open(serverDownloadUrl, '_blank');
        } else {
            // Local fallback if the remote routing system fails
            pdf.save(finalFileName);
        }

    } catch (err) {
        console.error(err);
        alert("Compilation or storage routing failed. Please try again.");
    } finally {
        pdfBtn.classList.remove('hidden');
        headerLoader.classList.add('hidden');
    }
}


function toggleSemModal(show) {
    const modal = document.getElementById('semModal');
    if (show) {
        renderSemOptions();
        modal.classList.remove('hidden');
        modal.offsetHeight;
        modal.classList.add('active-sheet');
    } else {
        modal.classList.remove('active-sheet');
        setTimeout(() => { if (!modal.classList.contains('active-sheet')) modal.classList.add('hidden'); }, 200);
    }
}

function renderSemOptions() {
    const container = document.getElementById('semOptionsList');
    container.innerHTML = semesters.map(s => `
        <button onclick="applyPremiumFilter('${s.value}', '${s.label}')" 
            class="w-full flex items-center justify-between p-4 mb-2 rounded-2xl transition-all ${selectedSemValue === s.value ? 'bg-red-600 text-white shadow-lg' : 'hover:bg-slate-50 text-slate-600 font-bold'}">
            <span class="text-sm">${s.label}</span>
            ${selectedSemValue === s.value ? '<i class="fa-solid fa-circle-check"></i>' : ''}
        </button>`).join('');
}

function applyPremiumFilter(val, label) {
    selectedSemValue = val;
    document.getElementById('currentSemesterText').innerText = label;
    toggleSemModal(false);
    const query = document.getElementById('mainSearch').value.toLowerCase();
    const filtered = courseData.filter(c => 
        (c.title.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)) &&
        (selectedSemValue === "all" || c.semester === selectedSemValue)
    );
    renderCourses(filtered);
}

document.getElementById('mainSearch').addEventListener('input', () => {
    applyPremiumFilter(selectedSemValue, document.getElementById('currentSemesterText').innerText);
});

// 5. DOCUMENT VIEWER & ZOOM SYSTEM
function openPaperByCode(code, batch) {
    const course = courseData.find(c => c.code === code);
    if (course) viewPaper(course.links[batch], `${course.title} - ${batch}`);
}

function viewPaper(links, title) {
    currentPages = Array.isArray(links) ? links : [links];
    document.getElementById('viewingTitle').innerText = title;
    const filmstrip = document.getElementById('paperFilmstrip');
    
    filmstrip.innerHTML = currentPages.map(url => `
        <div class="viewer-page">
            <div class="zoom-wrapper">
                <img src="${url}" loading="lazy" onload="initZoomForImage(this)">
            </div>
        </div>`).join('');
    
    const modal = document.getElementById('viewerModal');
    modal.classList.remove('hidden');
    document.body.classList.add('modal-open');
    requestAnimationFrame(() => modal.classList.add('viewer-active'));
    filmstrip.scrollTop = 0;
}

function closeViewer() {
    const modal = document.getElementById('viewerModal');
    modal.classList.remove('viewer-active');
    document.body.classList.remove('modal-open');
    setTimeout(() => {
        modal.classList.add('hidden');
        document.getElementById('paperFilmstrip').innerHTML = "";
    }, 550);
}

// 6. STABILIZED SMOOTH MOBILE PAN & PINCH ZOOM LOGIC
function initZoomForImage(img) {
    const wrapper = img.parentElement;
    let scale = 1, lastScale = 1, panX = 0, panY = 0, startX = 0, startY = 0;
    let startDist = 0, isPanning = false, lastTap = 0, originX = 0, originY = 0;
    const MIN_SCALE = 1, MAX_SCALE = 5;

    function update(mode = "instant") {
        img.style.transition = mode === "animate" ? "transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)" : "none";
        img.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
    }

    function clampPan() {
        const limitX = Math.max(0, (img.offsetWidth * scale - wrapper.offsetWidth) / 2);
        const limitY = Math.max(0, (img.offsetHeight * scale - wrapper.offsetHeight) / 2);
        panX = Math.max(-limitX, Math.min(limitX, panX));
        panY = Math.max(-limitY, Math.min(limitY, panY));
    }

    wrapper.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            isPanning = false;
            startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            lastScale = scale;
            const imgRect = img.getBoundingClientRect();
            originX = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - imgRect.left) / scale;
            originY = ((e.touches[0].clientY + e.touches[1].clientY) / 2 - imgRect.top) / scale;
        } else if (e.touches.length === 1) {
            isPanning = true;
            startX = e.touches[0].clientX - panX;
            startY = e.touches[0].clientY - panY;
        }
    }, { passive: false });

    wrapper.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, lastScale * (dist / startDist)));
            const rect = wrapper.getBoundingClientRect();
            const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
            panX = midX - (originX * scale);
            panY = midY - (originY * scale);
            clampPan();
            update("instant");
        } else if (e.touches.length === 1 && isPanning && scale > 1) {
            e.preventDefault();
            panX = e.touches[0].clientX - startX;
            panY = e.touches[0].clientY - startY;
            clampPan();
            update("instant");
        }
    }, { passive: false });

    wrapper.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTap < 300 && e.changedTouches.length === 1) {
            const rect = wrapper.getBoundingClientRect();
            const touch = e.changedTouches[0];
            if (scale > 1) {
                scale = 1; panX = 0; panY = 0;
            } else {
                scale = 2.5;
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                panX = (rect.width / 2 - x) * (scale - 1);
                panY = (rect.height / 2 - y) * (scale - 1);
            }
            clampPan();
            update("animate");
        }
        lastTap = now;
        isPanning = false;
    });
}

// 7. SINGLE PDF NOTES & DOCUMENT MATERIALS SYSTEM
function openNotes(code) {
    const course = courseData.find(c => c.code === code);
    const list = document.getElementById('notesList');
    const modal = document.getElementById('notesModal');
    document.getElementById('notesCourseTitle').innerText = `${course.code}: ${course.title}`;
    list.innerHTML = course.notes.map(note => `
        <div class="file-card" onclick="confirmDownload('${note.url}', '${note.name}.pdf')">
            <i class="fa-solid fa-file-pdf text-3xl text-red-600 mb-2"></i>
            <span class="text-[11px] font-bold text-slate-700 line-clamp-2">${note.name}</span>
            <span class="text-[9px] text-slate-400 mt-1 uppercase font-black tracking-wider">Download</span>
        </div>`).join('');
    modal.classList.remove('hidden');
    window.addEventListener('touchstart', handleTouchStart, { passive: false });
    window.addEventListener('touchmove', handleTouchMove, { passive: false });
    requestAnimationFrame(() => { modal.classList.add('active-sheet'); document.body.classList.add('modal-open'); });
}

function closeNotes() {
    const modal = document.getElementById('notesModal');
    modal.classList.remove('active-sheet');
    document.body.classList.remove('modal-open');
    window.removeEventListener('touchstart', handleTouchStart);
    window.removeEventListener('touchmove', handleTouchMove);
    setTimeout(() => { if (!modal.classList.contains('active-sheet')) modal.classList.add('hidden'); }, 500);
}

function confirmDownload(url, fileName) {
    if (document.getElementById('customAlert')) return;
    activeDownloadData = { url, fileName };

    const alertHTML = `
        <div id="customAlert" class="premium-alert-overlay">
            <div class="premium-alert-card">
                <div class="alert-icon-circle"><i class="fa-solid fa-cloud-arrow-down"></i></div>
                <h3 style="color: #1a1a1b; font-weight: 800; margin-bottom: 8px;">Download Notes?</h3>
                <p style="color: #64748b; font-size: 12px; line-height: 1.5;">${fileName}</p>
                <div class="alert-btn-group">
                    <button class="alert-btn btn-cancel" onclick="closeAlert()">Cancel</button>
                    <button class="alert-btn btn-confirm" onclick="executeDownload()">Download</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', alertHTML);
    setTimeout(() => document.getElementById('customAlert').classList.add('active'), 10);
}

function executeDownload() {
    if (!activeDownloadData) return;
    const { url, fileName } = activeDownloadData;
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    closeAlert();
}

function closeAlert() {
    const el = document.getElementById('customAlert');
    if (el) { el.classList.remove('active'); setTimeout(() => el.remove(), 300); }
}

function handleTouchStart(e) { touchStartLine = e.touches[0].pageY; }
function handleTouchMove(e) {
    const list = document.getElementById('notesList');
    if (list.scrollTop <= 0 && e.touches[0].pageY > touchStartLine) if (e.cancelable) e.preventDefault();
}

// 8. FORM HANDLERS
function openUpload() { document.getElementById('uploadModal').classList.remove('hidden'); }
function closeUpload() { document.getElementById('uploadModal').classList.add('hidden'); }

init();
</script>
